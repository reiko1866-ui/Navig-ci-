<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Magyar Navigáció</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #f0f0f0; }
    #map { width: 100%; height: 100vh; }
    
    /* Felhasználói felület panel */
    #panel {
      position: absolute;
      top: 15px; left: 15px; right: 15px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.98);
      padding: 15px;
      border-radius: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      border: 1px solid rgba(0,0,0,0.05);
    }
    
    #info-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    
    #gps-dot {
      height: 12px; width: 12px;
      background-color: #ccc; /* Alapértelmezett szürke */
      border-radius: 50%;
      margin-right: 10px;
      display: inline-block;
    }
    
    #gps-dot.active { background-color: #4CAF50; animation: pulse 2s infinite; }
    #gps-dot.error { background-color: #F44336; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }

    #status-text {
      font-weight: 600; font-size: 16px; color: #333;
    }
    
    #instruction {
      font-size: 15px; color: #555;
      margin-top: 4px; line-height: 1.4;
    }

    /* OSRM útvonal stílusa a térképen */
    .route-line {
      color: #1a73e8;
    }
  </style>
</head>
<body>

  <div id="panel">
    <div id="info-header">
      <span id="gps-dot"></span>
      <span id="status-text">📍 GPS pozíció keresése...</span>
    </div>
    <div id="instruction">Várj, amíg megtaláljuk a pozíciódat!</div>
  </div>
  
  <div id="map"></div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    let currentPos = null;
    let lastSpokenInstruction = "";
    let map;
    let userMarker;
    let watchId;

    // --- 1. Térkép inicializálása ---
    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        // OLYAN STÍLUST HASZNÁLUNK, AMIHEZ NEM KELL API KULCS
        style: 'https://demotiles.maplibre.org/style.json', // Alapértelmezett MapLibre stílus
        center: [19.0402, 47.4979], // Budapest
        zoom: 12, // Kezdeti zoom
        pitch: 0, // Kezdetben lapos nézet
        bearing: 0,
        attributionControl: false
      });

      // Navigációs gombok hozzáadása
      map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

      map.on('load', () => {
        // Miután betöltött, engedélyezzük a GPS követést
        startLocationTracking();
      });

      // Kattintás a térképre -> Útvonaltervezés
      map.on('click', onMapClick);
    }

    // --- 2. GPS Helymeghatározás indítása ---
    function startLocationTracking() {
      const gpsDot = document.getElementById('gps-dot');
      const statusText = document.getElementById('status-text');
      const instructionText = document.getElementById('instruction');

      if (!("geolocation" in navigator)) {
        statusText.innerText = "⚠️ GPS nem elérhető";
        gpsDot.className = 'error';
        return;
      }

      // Pontos GPS követés beállítása
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lng = position.coords.longitude;
          const lat = position.coords.latitude;
          const heading = position.coords.heading || 0;
          currentPos = [lng, lat];

          // UI Frissítése
          statusText.innerText = `GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          gpsDot.className = 'active';
          if (instructionText.innerText === "Várj, amíg megtaláljuk a pozíciódat!") {
             instructionText.innerText = "Kattints a térképre a célpont kijelöléséhez!";
          }

          // Felhasználói jelölő (marker) frissítése
          if (userMarker) {
            userMarker.setLngLat(currentPos);
          } else {
            // Egyedi kék kör a felhasználónak
            const el = document.createElement('div');
            el.className = 'user-marker';
            el.style.width = '20px'; el.style.height = '20px';
            el.style.backgroundColor = '#1a73e8';
            el.style.borderRadius = '50%';
            el.style.border = '3px solid white';
            el.style.boxShadow = '0 0 10px rgba(0,0,0,0.3)';
            
            userMarker = new maplibregl.Marker({element: el})
              .setLngLat(currentPos)
              .addTo(map);
          }

          // Kamera mozgatása és döntése (ha mozog)
          map.flyTo({
            center: currentPos,
            zoom: 16,
            pitch: 55, // 3D nézet döntése
            bearing: heading, // Haladási irányba forgatás
            essential: true,
            duration: 1000
          });
        },
        (error) => {
          console.error("Helymeghatározási hiba:", error);
          statusText.innerText = "⚠️ Helymeghatározási hiba!";
          gpsDot.className = 'error';
          instructionText.innerText = "Ellenőrizd a GPS engedélyeket!";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // --- 3. Magyar felolvasó (Text-to-Speech) ---
    function speak(text) {
      if ('speechSynthesis' in window && text !== lastSpokenInstruction) {
        window.speechSynthesis.cancel(); // Előző szöveg megszakítása
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hu-HU'; // Magyar nyelv
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
        lastSpokenInstruction = text;
      }
    }

    // --- 4. Kattintás és OSRM Útvonaltervezés ---
    async function onMapClick(e) {
      if (!currentPos) {
        alert("Várj, amíg a GPS megtalálja a pozíciódat!");
        return;
      }

      const dest = [e.lngLat.lng, e.lngLat.lat];
      const instructionText = document.getElementById('instruction');

      // OSRM API hívás (autós útvonal, ingyenes)
      const url = `https://router.project-osrm.org/route/v1/driving/${currentPos[0]},${currentPos[1]};${dest[0]},${dest[1]}?steps=true&geometries=geojson&overview=full`;

      try {
        instructionText.innerText = "Útvonal tervezése...";
        const response = await fetch(url);
        const data = await response.json();

        if (!data.routes || data.routes.length === 0) {
          instructionText.innerText = "❌ Nem található útvonal.";
          return;
        }

        const route = data.routes[0];
        const coords = route.geometry.coordinates;

        // Útvonal kirajzolása a térképre
        if (map.getSource('route')) {
          map.getSource('route').setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: coords }
          });
        } else {
          map.addSource('route', {
            type: 'geojson',
            data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } }
          });

          map.addLayer({
            id: 'route-layer',
            type: 'line',
            source: 'route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#1a73e8', 'line-width': 6, 'line-opacity': 0.8 }
          });
        }

        // Távolság és hangutasítás
        const distanceKm = (route.distance / 1000).toFixed(1);
        const durationMin = Math.round(route.duration / 60);
        
        const summaryText = `Útvonal tervezve: ${distanceKm} km, kb. ${durationMin} perc.`;
        instructionText.innerText = summaryText;

        // Magyar hangbemondás
        speak(`Útvonal megtervezve. A távolság ${distanceKm.replace('.', ',')} kilométer. Indulhatsz!`);

      } catch (err) {
        console.error("Útvonaltervezési hiba:", err);
        instructionText.innerText = "❌ Hiba történt az útvonaltervezés során.";
      }
    }

    // Indítás
    initMap();
  </script>
</body>
</html>
