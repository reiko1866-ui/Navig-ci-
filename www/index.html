<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cartoon Navigation</title>
  
  <!-- MapLibre GL CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    #map { width: 100%; height: 100vh; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(255, 255, 255, 0.9); padding: 10px 15px;
      border-radius: 8px; font-family: sans-serif; font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="info">📍 GPS pozíció lekérése...</div>
  <div id="map"></div>

  <script>
    // 1. Térkép inicializálása ingyenes OpenStreetMap csempékkel
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm-tiles': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'osm-layer',
            type: 'raster',
            source: 'osm-tiles',
            minzoom: 0,
            maxzoom: 19
          }
        ]
      },
      center: [19.0402, 47.4979], // Alapértelmezett: Budapest
      zoom: 15,
      pitch: 45 // 3D döntés
    });

    // 2. Valódi GPS pozíció lekérése
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lng = position.coords.longitude;
          const lat = position.coords.latitude;
          
          document.getElementById('info').innerText = `📍 Pozíció: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          
          // Térkép középpontba állítása a valódi GPS koordinátánál
          map.flyTo({ center: [lng, lat], zoom: 16 });
        },
        (error) => {
          document.getElementById('info').innerText = "⚠️ GPS hiba: Engedélyezd a helymeghatározást!";
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
