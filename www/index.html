<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Navigáció</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <form id="search" autocomplete="off">
    <input id="q" type="search" placeholder="Hősök tere, Budapest" enterkeyhint="search" aria-label="Cél">
    <button type="submit">Keresés</button>
  </form>
  <ul id="results" hidden></ul>
  <ul id="routes" hidden></ul>
  <section id="panel" hidden>
    <h2>Manőverek</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Manőver</th>
          <th>Utca</th>
          <th>Távolság</th>
        </tr>
      </thead>
      <tbody id="maneuvers"></tbody>
    </table>
  </section>
  <div id="banner" hidden>
    <p id="turnDist">—</p>
    <p id="turnText">—</p>
    <p id="turnStreet"></p>
  </div>
  <p id="traffic" hidden></p>
  <p id="status">Keresés egy célra.</p>
  <p id="limitNext" hidden></p>
  <div id="limit" hidden><span id="limitVal">—</span></div>
  <p id="update" hidden>
    <span id="updateText">Új verzió</span>
    <button type="button" id="updateGo">Frissítés</button>
  </p>
  <p id="cue" hidden></p>
  <button type="button" id="go" hidden>Indulás</button>
  <script src="./limits.js"></script>
  <script src="./traffic.js"></script>
  <script src="./cue.js"></script>
  <script src="./voice.js"></script>
  <script src="./update.js"></script>
  <script src="./vendor/three.min.js"></script>
  <script src="./world.js"></script>
  <script src="./app.js"></script>
</body>
</html>
