<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jáksó Navigáció</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #e0e0e0; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; }
    
    #panel {
      position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10;
      background: rgba(255, 255, 255, 0.98); padding: 12px 15px; border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 10px;
    }
    
    #info-header { display: flex; align-items: center; justify-content: space-between; }
    #status-container { display: flex; align-items: center; }
    #gps-dot { height: 12px; width: 12px; background-color: #4CAF50; border-radius: 50%; margin-right: 8px; display: inline-block; }
    #status-text { font-weight: bold; font-size: 14px; color: #333; }
    #instruction { font-size: 13px; color: #555; }

    #search-box { display: flex; gap: 8px; }
    #search-input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; outline: none; }
    #search-btn { background: #0066ff; color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="panel">
    <div id="info-header">
      <div id="status-container">
        <span id="gps-dot"></span>
        <span id="status-text">📍 GPS: Keresés...</span>
      </div>
    </div>

    <div id="search-box">
      <input type="text" id="search-input" placeholder="Hová megyünk?" onkeypress="handleKeyPress(event)">
      <button id="search-btn" onclick="searchAddress()">Keresés</button>
    </div>

    <div id="instruction">Írj be egy címet, vagy bökj a térképre!</div>
  </div>
  
  <div id="map"></div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    let currentPos = null;
    let lastPlayedSound = "";
    let map;
    let userMarker;
    let destMarker;
    let currentAudio = null;

    // 1. Térkép inicializálása
    map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'carto-voyager': {
            type: 'raster',
            tiles: [
              'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png',
              'https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png',
              'https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png'
            ],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
          }
        },
        layers: [{ id: 'carto-layer', type: 'raster', source: 'carto-voyager', minzoom: 0, maxzoom: 19 }]
      },
      center: [19.0402, 47.4979],
      zoom: 15,
      pitch: 45
    });

    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

    // 2. Jáksó .ogg Hang lejátszó funkció
    function playJaksoSound(fileName) {
      if (lastPlayedSound === fileName) return; // Ne ismételje egymás után kétszer ugyanazt
      
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      // A sounds/ mappából tölti be a fájlt
      currentAudio = new Audio(`sounds/${fileName}`);
      currentAudio.play().catch(err => console.log("A lejátszás még nem engedélyezett vagy hiányzik a fájl:", err));
      lastPlayedSound = fileName;
    }

    // 3. GPS Követés
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lng = position.coords.longitude;
          const lat = position.coords.latitude;
          const heading = position.coords.heading || 0;
          currentPos = [lng, lat];

          document.getElementById('status-text').innerText = `📍 GPS csatlakozva`;

          if (userMarker) {
            userMarker.setLngLat(currentPos);
          } else {
            const el = document.createElement('div');
            el.style.width = '22px'; el.style.height = '22px';
            el.style.backgroundColor = '#1a73e8';
            el.style.borderRadius = '50%';
            el.style.border = '3px solid white';
            el.style.boxShadow = '0 0 10px rgba(0,0,0,0.4)';
            
            userMarker = new maplibregl.Marker({element: el}).setLngLat(currentPos).addTo(map);
          }

          map.flyTo({
            center: currentPos,
            zoom: 16,
            pitch: 50,
            bearing: heading,
            duration: 1000
          });
        },
        (err) => console.error(err),
        { enableHighAccuracy: true }
      );
    }

    function handleKeyPress(e) { if (e.key === 'Enter') searchAddress(); }

    // 4. Címkeresés
    async function searchAddress() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      document.getElementById('instruction').innerText = "Cím keresése...";

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=hu&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.length > 0) {
          planRoute([parseFloat(data[0].lon), parseFloat(data[0].lat)], data[0].display_name.split(',')[0]);
        } else {
          document.getElementById('instruction').innerText = "❌ Nem található ilyen cím!";
        }
      } catch (err) {
        console.error(err);
      }
    }

    map.on('click', (e) => { planRoute([e.lngLat.lng, e.lngLat.lat]); });

    // 5. OSRM Útvonaltervezés és Hangválasztás
    async function planRoute(destCoords, placeName = "") {
      if (!currentPos) {
        alert("Várj a GPS pozícióra!");
        return;
      }

      const url = `https://router.project-osrm.org/route/v1/driving/${currentPos[0]},${currentPos[1]};${destCoords[0]},${destCoords[1]}?steps=true&geometries=geojson&overview=full`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const coords = route.geometry.coordinates;

          if (destMarker) destMarker.remove();
          destMarker = new maplibregl.Marker({ color: '#ff3333' }).setLngLat(destCoords).addTo(map);

          if (map.getSource('route')) {
            map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
          } else {
            map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
            map.addLayer({ id: 'route-layer', type: 'line', source: 'route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#0066ff', 'line-width': 7 } });
          }

          const dist = (route.distance / 1000).toFixed(1);
          const mins = Math.round(route.duration / 60);
          document.getElementById('instruction').innerText = placeName ? `Cél: ${placeName} (${dist} km, ${mins} perc)` : `Útvonal: ${dist} km, kb. ${mins} perc.`;

          // ÚTVONAL INDÍTÁSAKOR JÁKSÓ HANG:
          playJaksoSound('indulhatunk.ogg');
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
