cd ~/Navig-ci-

# 1. Workflow fájl felülírása
cat << 'EOF' > .github/workflows/android.yml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Sync
        run: |
          npm install
          npx cap sync android

      - name: Grant execute permission
        run: |
          chmod +x android/gradlew

      - name: Build with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonNav-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
EOF

# 2. Gradlew jogok beállítása és feltolás
cd android && chmod +x gradlew && git update-index --chmod=+x gradlew
cd ~/Navig-ci-
git add .
git commit -m "Fix gradlew execution permissions"
git push origin main
